[package]
name = "tl2-mikuro-mod-packer-rs"
version = "0.1.0"
edition = "2021"
description = "Torchlight 2 .MOD builder — Rust port of mikuro_mod_packer (BINDAT / BINLAYOUT / RAW / MPP compilers + .MOD container)"
license = "GPL-3.0-or-later"

[[bin]]
name = "tl2-mikuro-mod-packer"
path = "src/main.rs"

[dependencies]
mimalloc = { version = "0.1", default-features = false }
rayon = "1.10"
regex = "1"
indexmap = "2"
crc32fast = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
libdeflater = "1.25.2"
# Interactive TUI. crossterm is used via ratatui's re-export.
ratatui = "0.29"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",   # GetUserDefaultUILanguage — TUI language detection
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
] }

[profile.release]
lto = "thin"
codegen-units = 1
