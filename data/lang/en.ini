# English strings for the Mikuro Torchlight II Mod Un/Packer TUI.
#
# Format: key=value, one per line. Everything after the FIRST '=' is the value
# VERBATIM — leading spaces are significant (they indent the Help page), so do
# not "tidy" them. Lines starting with '#' are comments.
#
# These files are compiled into the exe. To change wording or add a language
# without rebuilding, drop an edited copy next to the exe as  lang/en.ini  —
# keys found there win over the built-in ones, and anything you leave out falls
# back to the built-in text (then to English).
#
# Command names, flags and env-var names are NOT translated anywhere: they are
# what the user types.

