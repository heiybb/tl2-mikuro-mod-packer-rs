# ── base MEDIA question ────────────────────────────────────────────────────
# Asked when nothing beside the exe answers it and TL2_MEDIA_DIR is unset. The
# packer does not search for an install on its own: a machine can hold several
# usable trees and picking the wrong one drops linked geometry with no error.
base_prompt_title=Base game data not found
base_prompt_why=Level pathing needs the base game's MEDIA. Nothing was found next to this exe and TL2_MEDIA_DIR is not set. Choose how to proceed:
base_opt_search=1  Let the packer look for an installed Torchlight II on this machine
base_opt_manual=2  Type or paste the path myself
base_pick_title=Installs found - pick the tree your mod is built against:
base_manual_how=You can also set TL2_MEDIA_DIR to the game's MEDIA folder before starting the packer:

base_choice_remembered=A base you chose when asked is remembered here, re-checked each launch, and changed with  b :
base_input_how=Path to the game's MEDIA folder — or the game folder, or a DATA.PAK. Paste works; Enter confirms, Esc goes back.
base_input_bad=  That path holds no game data (looked for LEVELSETS/, MEDIA/LEVELSETS/, PAKS/DATA.PAK).